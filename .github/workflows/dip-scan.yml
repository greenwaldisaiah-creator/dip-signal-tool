name: Dip Scan

# Data budget:
#   Without TWELVEDATA_API_KEY -- Alpha Vantage only, 25 requests/day. The
#     watchlist self-limits to 11 symbols and the long-run trend comes from the
#     weekly series, because outputsize=full is a premium endpoint there.
#   With TWELVEDATA_API_KEY -- 800 requests/day and deep daily history, so the
#     watchlist expands to 21 symbols automatically and the backtest works.
# Either way the tool counts its own requests and stops cleanly rather than
# failing halfway through with a rate-limit error.

on:
  schedule:
    # --- Continuous intraday: every 15 minutes through the US session ---
    # 13:30-20:00 UTC = 9:30am-4:00pm ET during EDT. 15-minute bars only produce
    # new data every 15 minutes, so this is the fastest cadence that actually
    # tells you anything new. 27 sweeps/day.
    - cron: "30,45 13 * * 1-5"        # 9:30, 9:45 ET
    - cron: "*/15 14-19 * * 1-5"      # 10:00 - 3:45 ET
    - cron: "0 20 * * 1-5"            # 4:00 ET
    # --- End-of-day scan, on settled daily bars ---
    - cron: "15 21 * * 1-5"           # 5:15pm ET
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: end-of-day
        options:
          - end-of-day          # normal scan; alerts only if something qualifies
          - intraday            # 15-minute bars, daily trend context
          - end-of-day-notify   # scan, and message even if nothing qualifies
          - telegram-test       # just prove the bot can reach your phone
          - history             # paper-trading log + performance summary
          - backtest            # replay the strategy over years of history
          - optimize-preview    # sweep and report, change nothing
          - optimize            # sweep, and ADOPT the winner if it validates
          - autotune            # adjust selectivity from realised paper results
      years:
        description: "Backtest only: years of history to replay"
        type: string
        default: "3"


# A slow run must never overlap the next 15-minute tick. Queued runs are
# cancelled rather than piling up and double-spending the credit budget.
# The scan commits its trade history back to the repo, so it needs write access
# to its own contents. This uses the automatic GITHUB_TOKEN -- no personal token
# is ever created or stored.
permissions:
  contents: write

concurrency:
  group: dip-scan
  cancel-in-progress: false

jobs:
  scan:
    if: inputs.mode != 'backtest' && inputs.mode != 'optimize' && inputs.mode != 'optimize-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persist the price/filing cache and alert-dedupe state between runs so
      # the tool stays inside the request budget and does not re-alert the same
      # setup daily. The intraday run reuses the daily bars the end-of-day run
      # cached, which is what keeps intraday to one request per symbol.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: dip-scan-${{ github.run_id }}
          restore-keys: dip-scan-

      # A manual run uses the dropdown. A scheduled run has no inputs, so the
      # cron expression itself decides: the midday one means intraday.
      - name: Select mode
        id: select
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            # Only the 21:15 cron is the end-of-day scan. Every other schedule
            # is one of the intraday ticks.
            if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ]; then
              MODE="end-of-day"
            else
              MODE="intraday"
            fi
          fi
          case "$MODE" in
            telegram-test)      CMD="test-telegram" ;;
            history)            CMD="history --telegram" ;;
            autotune)           CMD="autotune --apply" ;;
            intraday)           CMD="scan --intraday" ;;
            end-of-day-notify)  CMD="scan --always-send" ;;
            *)                  CMD="scan" ;;
          esac
          echo "Mode: $MODE  ->  signal_tool.py $CMD"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # Optional. When present, prices come from Twelve Data (800 req/day,
          # deep history) and Alpha Vantage becomes the fallback + news source.
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Position sizing. Set these under the Variables tab, not Secrets.
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT }}
          # Intraday fires 27x/day, so it holds a higher bar than end-of-day.
          INTRADAY_MIN_SCORE: ${{ vars.INTRADAY_MIN_SCORE }}
          # Set to 70 to alert only on HIGH CONVICTION setups.
          ALERT_MIN_SCORE: ${{ vars.ALERT_MIN_SCORE }}
          # Trading costs. Slippage hits stop/time exits only.
          SLIPPAGE_BPS: ${{ vars.SLIPPAGE_BPS }}
          COMMISSION_USD: ${{ vars.COMMISSION_USD }}
          PAPER_TRADE_USD: ${{ vars.PAPER_TRADE_USD }}
          PAPER_MAX_HOLD_DAYS: ${{ vars.PAPER_MAX_HOLD_DAYS }}
        run: python signal_tool.py ${{ steps.select.outputs.cmd }}

      # Persist paper-trading history in the repository itself. The Actions
      # cache is evicted after 7 days untouched, which would silently erase
      # months of results. Only commits when a file actually changed, so this
      # does not add a commit on every one of the 28 daily runs.
      - name: Persist trade history
        if: always()
        run: |
          if [ -z "$(git status --porcelain trades.json params.json state.json 2>/dev/null)" ]; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name  "dip-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add each file only if it exists. Passing a missing path makes
          # `git add` fail for the whole list, which would silently stage
          # nothing and commit nothing while still looking successful.
          for f in trades.json params.json state.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "chore: paper trading history [skip ci]"
          # Another run may have committed while this one was scanning.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 3
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

  optimize:
    # Manual only. Sweeps trade geometry over years of history, so it needs the
    # same long timeout as the backtest.
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'optimize' || inputs.mode == 'optimize-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: dip-scan-${{ github.run_id }}
          restore-keys: dip-scan-
      - name: Run optimizer
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # optimize-preview reports only. optimize adopts a validated winner.
          APPLY=""
          [ "${{ inputs.mode }}" = "optimize" ] && APPLY="--apply"
          python signal_tool.py optimize --years "${{ inputs.years || '5' }}" $APPLY

      - name: Persist tuned parameters
        if: always()
        run: |
          if [ -z "$(git status --porcelain params.json 2>/dev/null)" ]; then
            echo "No parameter changes to commit."
            exit 0
          fi
          git config user.name  "dip-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f params.json ] && git add -- params.json
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "chore: tuned parameters from optimize [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

  backtest:
    # Manual only. Needs far longer than a scan tick: it pulls full history for
    # every symbol at the free tier's 8 requests/minute, then replays years of
    # bars through the same entry/stop/target rules the live tracker uses.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: dip-scan-${{ github.run_id }}
          restore-keys: dip-scan-
      - name: Run backtest
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_tool.py backtest --years "${{ inputs.years || '3' }}" --telegram

  test:
    # Only on manual runs and pushes -- not on all 27 daily scheduled ticks.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python test_signal_tool.py
